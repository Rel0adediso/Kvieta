name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj

      - name: Restore and audit dependencies
        shell: pwsh
        run: dotnet restore Kvieta.slnx -p:NuGetAudit=true -p:NuGetAuditMode=all

      - name: Verify formatting
        shell: pwsh
        run: dotnet format Kvieta.slnx --verify-no-changes --no-restore

      - name: Verify documentation consistency
        shell: pwsh
        run: ./scripts/verify-documentation.ps1

      - name: Build Debug
        shell: pwsh
        run: dotnet build Kvieta.slnx -c Debug --no-restore

      - name: Run development smoke tests
        shell: pwsh
        run: dotnet run --project tests/Kvieta.Core.SmokeTests/Kvieta.Core.SmokeTests.csproj -c Debug --no-build

      - name: Build public Release
        shell: pwsh
        run: dotnet build Kvieta.slnx -c Release --no-restore

      - name: Run public-build smoke tests
        shell: pwsh
        run: dotnet run --project tests/Kvieta.Core.SmokeTests/Kvieta.Core.SmokeTests.csproj -c Release --no-build

      - name: Verify development bypasses are absent
        shell: pwsh
        run: ./scripts/verify-public-build.ps1

      - name: Publish public single-file executable
        shell: pwsh
        run: |
          dotnet publish src/Kvieta.App/Kvieta.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:Version=1.0.0 `
            -p:PublishSingleFile=true `
            -p:PublishDir='${{ runner.temp }}\kvieta-public\'

      - name: Verify public publish output
        shell: pwsh
        run: ./scripts/verify-publish-output.ps1 -PublishDirectory '${{ runner.temp }}\kvieta-public' -ExpectedVersion 1.0.0

  package:
    name: Package community alpha installer
    runs-on: windows-latest
    needs: validate
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj

      - name: Build community installer
        shell: pwsh
        run: ./scripts/build-test-installer.ps1 -Version 1.0.0 -ReleaseLabel Alpha-1-Hotfix-2 -CommunityRelease

      - name: Verify package manifest
        shell: pwsh
        run: |
          ./scripts/verify-release-manifest.ps1 `
            -ManifestPath './artifacts/installer-community/1.0.0/release-manifest.json' `
            -ExpectedCommit '${{ github.sha }}' `
            -ExpectedPackageKind community

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: Kvieta-Alpha-1-Hotfix-2-community
          path: artifacts/installer-community/1.0.0/
          if-no-files-found: error
          retention-days: 7
